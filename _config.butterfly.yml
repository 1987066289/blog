ion-delay: 0.15s; }#recent-posts .recent-post-item:nth-child(3) { animation-delay: 0.25s; }#recent-posts .recent-post-item:nth-child(4) { animation-delay: 0.35s; }#recent-posts .recent-post-item:nth-child(5) { animation-delay: 0.45s; }#recent-posts .recent-post-item:nth-child(6) { animation-delay: 0.55s; }@keyframes cardIn {from { opacity: 0; transform: translateY(26px); }to { opacity: 1; transform: translateY(0); }}#recent-posts .recent-post-item:hover {transform: translateY(-6px);box-shadow: 0 14px 36px rgba(30, 34, 70, 0.16);}#recent-posts .post_cover img.post_bg {transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1), filter 0.5s ease;}#recent-posts .recent-post-item:hover .post_cover img.post_bg {transform: scale(1.06);}#recent-posts .recent-post-info .article-title {transition: color 0.25s ease;}#recent-posts .recent-post-item:hover .article-title {color: #4e7cff;}[data-theme="dark"] #recent-posts .recent-post-item:hover .article-title {color: #8fb0ff;}#article-container {font-size: 1.02em;line-height: 1.95;letter-spacing: 0.02em;word-break: break-word;}#article-container p {margin: 0 0 1.15em;}#article-container h1, #article-container h2, #article-container h3, #article-container h4 {font-weight: 700;letter-spacing: 0.02em;margin: 1.9em 0 0.9em;}#article-container h2 {padding-bottom: 0.35em;border-bottom: 1px dashed rgba(128, 128, 148, 0.35);}#article-container a {border-bottom: none;text-decoration: underline;text-decoration-color: rgba(78, 124, 255, 0.35);text-underline-offset: 4px;transition: color 0.2s ease, text-decoration-color 0.2s ease;}#article-container a:hover {color: #4e7cff;text-decoration-color: #4e7cff;}#article-container blockquote {border: none;border-left: 4px solid #7a9bff;border-radius: 0 10px 10px 0;background: linear-gradient(90deg, rgba(122, 155, 255, 0.12), rgba(122, 155, 255, 0.03));padding: 0.9em 1.3em;margin: 1.4em 0;}[data-theme="dark"] #article-container blockquote {border-left-color: #6c86d8;background: linear-gradient(90deg, rgba(108, 134, 216, 0.14), rgba(108, 134, 216, 0.04));}#article-container table {border-radius: 10px;overflow: hidden;box-shadow: 0 2px 10px rgba(30, 34, 70, 0.08);}#article-container table th {background: linear-gradient(90deg, #5b7bd5, #7a6bd5);color: #fff;font-weight: 600;}#article-container table tr:nth-child(even) td {background: rgba(122, 155, 255, 0.06);}#article-container img {border-radius: 10px;box-shadow: 0 4px 18px rgba(30, 34, 70, 0.12);}#article-container code:not([class*="language-"]) {border-radius: 6px;padding: 0.15em 0.45em;margin: 0 0.1em;color: #c7254e;background: rgba(199, 37, 78, 0.08);}[data-theme="dark"] #article-container code:not([class*="language-"]) {color: #ff8fa8;background: rgba(255, 143, 168, 0.12);}::selection {background: rgba(78, 124, 255, 0.3);}::-webkit-scrollbar {width: 8px;height: 8px;}::-webkit-scrollbar-thumb {background: linear-gradient(180deg, #6e8efb, #a77bf3);border-radius: 8px;}::-webkit-scrollbar-thumb:hover {background: linear-gradient(180deg, #5a7bf5, #946bf0);}::-webkit-scrollbar-track {background: transparent;}#aside-content .card-widget {border-radius: 14px;box-shadow: 0 4px 16px rgba(30, 34, 70, 0.06);transition: box-shadow 0.3s ease, transform 0.3s ease;}#aside-content .card-widget:hover {box-shadow: 0 10px 28px rgba(30, 34, 70, 0.12);}#aside-content .avatar-img {transition: transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);}#aside-content .card-info:hover .avatar-img {transform: rotate(360deg) scale(1.05);}#rightside #go-up, #rightside #go-down {border-radius: 50% !important;backdrop-filter: blur(8px);}#footer {background: transparent;box-shadow: none;}#footer::before {content: "";display: block;height: 2px;width: 180px;margin: 0 auto 1.2em;border-radius: 2px;background: linear-gradient(90deg, transparent, #6e8efb, #a77bf3, transparent);}#footer .footer-copyright, #footer .footer_custom_text {opacity: 0.72;letter-spacing: 0.03em;}[data-theme="dark"] body {--card-bg: #1e1c26;}[data-theme="dark"] #recent-posts .