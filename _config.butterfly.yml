tion: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;}#scroll-down::before {content: "开始阅读";display: block;font-size: 0.95rem;letter-spacing: 0.15em;color: rgba(255, 255, 255, 0.95);margin-bottom: 0.15em;}#scroll-down .scroll-down-effects {position: static !important;left: auto !important;margin: 0 auto;display: block;color: rgba(255, 255, 255, 0.9);animation: bounceDown 1.8s ease-in-out infinite;}#scroll-down:hover {background: rgba(255, 255, 255, 0.28);transform: translateY(-2px);box-shadow: 0 8px 30px rgba(0, 0, 0, 0.26);}@keyframes bounceDown {0%, 100% { transform: translateY(0); opacity: 0.85; }50% { transform: translateY(5px); opacity: 1; }}#reading-progress-bar {position: fixed;top: 0;left: 0;height: 3px;width: 0;z-index: 1000;border-radius: 0 3px 3px 0;background: linear-gradient(90deg, #4e7cff, #9a6bff, #4ad0c4);box-shadow: 0 0 10px rgba(122, 155, 255, 0.55);opacity: 0;transition: opacity 0.3s ease;pointer-events: none;}#recent-posts .post_cover { position: relative; }#recent-posts .post_cover::after {content: "";position: absolute;top: 0;left: -80%;width: 45%;height: 100%;background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.35), transparent);transform: skewX(-18deg);pointer-events: none;}#recent-posts .recent-post-item:hover .post_cover::after {animation: coverShine 0.9s ease forwards;}@keyframes coverShine {to { left: 130%; }}#recent-posts .recent-post-item:hover .article-title {background: linear-gradient(92deg, #4e7cff, #9a6bff);-webkit-background-clip: text;background-clip: text;-webkit-text-fill-color: transparent;}[data-theme="dark"] #recent-posts .recent-post-item:hover .article-title {background: linear-gradient(92deg, #8fb0ff, #c9a8ff);-webkit-background-clip: text;background-clip: text;-webkit-text-fill-color: transparent;}#article-container .toc-link.active,.toc-link.active {font-weight: 600;color: #5b7bd5 !important;border-left-color: #5b7bd5 !important;}[data-theme="dark"] #page-header {background: linear-gradient(-45deg, #171d33, #2c2749, #3d2f5c, #1c3247) !important;background-size: 400% 400% !important;}#aside-content .card-widget {animation: cardIn 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) both;animation-delay: 0.3s;}#article-container img {transition: filter 0.35s ease, transform 0.35s ease;}#article-container img:hover {filter: brightness(1.05);}</style>'
