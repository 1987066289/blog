# ===================================
# Butterfly 主题外观配置（覆盖文件）
# 改这里的配置会覆盖主题默认值，主题升级也不受影响
# 完整可配置项见 node_modules/hexo-theme-butterfly/_config.yml
# 主题文档: https://butterfly.js.org/
# ===================================

# ----- 导航栏菜单（/tags 等页面文件已在 source/ 下创建好）-----
nav:
  首页: / || fas fa-home
  文章 || fas fa-list || hide:
    归档: /archives/ || fas fa-archive
    标签: /tags/ || fas fa-tags
    分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-user

# ----- 深色模式（右上角有切换按钮，跟随系统自动切换）-----
darkmode:
  enable: true
  button: true
  autoChangeMode: 1 # 1 跟随系统 2 按 18:00-6:00 自动切换 false 不自动
  start: # 亮色起始时间（0-24，默认 6）
  end: # 暗色起始时间（0-24，默认 18）

# ----- 侧边栏 -----
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 欢迎来到我的博客
    button:
      enable: true
      icon: fab fa-github
      text: GitHub 主页
      link: https://github.com/1987066289
  card_announcement:
    enable: true
    content: 欢迎光临，随便看看～
  card_recent_post:
    enable: true
    limit: 5
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# ----- 头像（★ 换成你自己的图片：把图片放到 source/img/ 下，写 /img/文件名.jpg）-----
avatar:
  img: /img/avatar.png
  effect: false

# ----- 站内搜索（已装 hexo-generator-searchdb，无需联网服务）-----
search:
  use: local_search
  placeholder: 搜索文章…
  local_search:
    top_n_per_article: 1

# ----- 代码块：Mac 窗口样式 + 一键复制 -----
code_blocks:
  theme: light # 代码配色: darker / pale night / light / ocean / false
  macStyle: true # Mac 风格窗口圆点
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false # false 默认展开，true 默认折叠

# ----- 文章页信息显示 -----
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
  post:
    date_type: both # 显示创建与更新时间
    date_format: date
    categories: true
    tags: true

# ----- 文章目录 -----
toc:
  post: true
  page: false
  number: true
  expand: true
  style_simple: false
  scroll_percent: true

# ----- 相关文章推荐 -----
related_post:
  enable: true
  limit: 6
  date_type: created

# ----- 文章版权声明（作者与链接自动取自 _config.yml 的 author 和 url）-----
post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/1987066289
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 打赏二维码（暂时关闭，想开启就改 enable: true 并放图片到 source/img/）
reward:
  enable: false

# ----- 文章底部分享按钮 -----
share:
  use: sharejs
  sharejs:
    sites: wechat,qq,qzone,weibo

# ----- 图片懒加载 + 点击放大 -----
lazyload:
  enable: true
  field: site
  placeholder:
  blur: false

lightbox: fancybox

# ----- 页脚 -----
footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: false
  custom_text: 由 Hexo 强力驱动 | 托管于 EdgeOne Pages

# ----- 右下角按钮 -----
rightside_scroll_percent: true # 回到顶部按钮显示阅读百分比

# ----- 评论系统（默认关闭，以后想加再开，如 Waline/Twikoo/Giscus）-----
comments:
  use:

# ----- 自定义注入：首页大横幅首次下滚后向上收起，本次访问内不再出现 -----
inject:
  head:
    - '<style>body.hero-gone #page-header{height:0!important;overflow:hidden}body.hero-gone #site-info,body.hero-gone #scroll-down{display:none!important}body.hero-gone #nav{position:fixed!important;top:0}body.hero-gone #nav:not(.fixed){background:var(--card-bg);box-shadow:0 1px 4px rgba(0,0,0,.15)}body.hero-gone #nav:not(.fixed) a,body.hero-gone #nav:not(.fixed) #site-name,body.hero-gone #nav:not(.fixed) .site-page{color:var(--font-color)!important}</style>'
  bottom:
    - '<script>
(function(){
  var KEY = "heroGone";
  var body = document.body;
  function applyGone(){
    body.classList.add("hero-gone");
    var h = document.getElementById("page-header");
    if(h) h.style.height = "";
  }
  var fresh = false;
  try{ fresh = sessionStorage.getItem(KEY) !== "1"; }catch(e){ fresh = true; }
  if(!fresh){ applyGone(); return; } // 本次访问已收起过，直接隐藏

  var locked = false, finished = false;
  function dismiss(){
    if(locked || finished) return;
    var header = document.getElementById("page-header");
    var siteInfo = document.getElementById("site-info");
    if(!header || !siteInfo) return; // 仅首页（有大标题横幅）生效
    locked = true;
    try{ sessionStorage.setItem(KEY, "1"); }catch(e){}
    var h0 = header.offsetHeight;
    var y0 = window.scrollY || document.documentElement.scrollTop || 0;
    var dur = 380, t0 = null;
    function frame(now){
      if(t0 === null) t0 = now;
      var p = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - p, 2); // easeOutQuad：干脆利落的“跳转”感
      header.style.overflow = "hidden";
      header.style.height = (h0 * (1 - e)) + "px";
      window.scrollTo(0, y0 + h0 * e); // 横幅上收的同时内容整体上移一屏
      if(p < 1){ requestAnimationFrame(frame); }
      else{ locked = false; finished = true; applyGone(); }
    }
    requestAnimationFrame(frame);
  }

  // 第一次向下滚轮：瞬间跳到内容区，动画期间锁定滚动
  window.addEventListener("wheel", function(ev){
    if(finished) return;
    if(locked){ ev.preventDefault(); return; }
    if(ev.deltaY > 2 && !ev.ctrlKey){ ev.preventDefault(); dismiss(); }
  }, { passive: false });

  // 触屏：第一次下滑手势
  var touchY = null;
  window.addEventListener("touchstart", function(ev){ touchY = ev.touches[0].clientY; }, { passive: true });
  window.addEventListener("touchmove", function(ev){
    if(finished) return;
    if(locked){ ev.preventDefault(); return; }
    if(touchY !== null && ev.touches[0].clientY < touchY - 15){ ev.preventDefault(); dismiss(); }
  }, { passive: false });

  // 键盘翻页 / 拖动滚动条兜底
  window.addEventListener("scroll", function(){
    if(!finished && (window.scrollY || document.documentElement.scrollTop) > 60) dismiss();
  }, { passive: true });
})();
</script>'
