# ===================================
# Butterfly 主题外观配置（覆盖文件）
# 改这里的配置会覆盖主题默认值，主题升级也不受影响
# 完整可配置项见 node_modules/hexo-theme-butterfly/_config.yml
# 主题文档: https://butterfly.js.org/
# ===================================

# ----- 导航栏菜单（/tags 等页面文件已在 source/ 下创建好）-----
nav:
  首页: / || fas fa-home
  文章 || fas fa-list || hide:
    归档: /archives/ || fas fa-archive
    标签: /tags/ || fas fa-tags
    分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-user

# ----- 深色模式（右上角有切换按钮，跟随系统自动切换）-----
darkmode:
  enable: true
  button: true
  autoChangeMode: 1 # 1 跟随系统 2 按 18:00-6:00 自动切换 false 不自动
  start: # 亮色起始时间（0-24，默认 6）
  end: # 暗色起始时间（0-24，默认 18）

# ----- 侧边栏 -----
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 欢迎来到我的博客
    button:
      enable: true
      icon: fab fa-github
      text: GitHub 主页
      link: https://github.com/1987066289
  card_announcement:
    enable: true
    content: 欢迎光临，随便看看～
  card_recent_post:
    enable: true
    limit: 5
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# ----- 头像（★ 换成你自己的图片：把图片放到 source/img/ 下，写 /img/文件名.jpg）-----
avatar:
  img: /img/avatar.png
  effect: true # 悬浮旋转

# ----- 首页副标题：打字机效果 -----
subtitle:
  enable: true
  effect: true
  typed_option:
  source: false
  sub:
    - 记录学习，分享生活
    - 代码之外，另有天地
    - 保持热爱，奔赴山海
    - 慢慢来，比较快

# ----- 社交图标（侧边栏头像下方）-----
social:
  fab fa-github: https://github.com/1987066289 || GitHub || "#24292e"

# ----- 文章封面：无封面时自动使用默认渐变图 -----
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/cover-1.png
    - /img/cover-2.png

# ----- 首页卡片布局：4 = 封面上、信息下的杂志风卡片 -----
index_layout: 4

# ----- 首页摘要长度（卡片更清爽）-----
index_post_content:
  method: 3
  length: 160

# ----- 标题装饰：小图标前缀 -----
beautify:
  enable: true
  field: post
  title_prefix_icon: "\f292"
  title_prefix_icon_color: "#7a9bff"

# ----- 分隔线装饰 -----
hr_icon:
  enable: true
  icon: "\f005"
  icon_top:

# ----- 字数与阅读时长（降低阅读门槛的心理暗示）-----
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# ----- 站内搜索（已装 hexo-generator-searchdb，无需联网服务）-----
search:
  use: local_search
  placeholder: 搜索文章…
  local_search:
    top_n_per_article: 1

# ----- 代码块：Mac 窗口样式 + 一键复制 -----
code_blocks:
  theme: light # 代码配色: darker / pale night / light / ocean / false
  macStyle: true # Mac 风格窗口圆点
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false # false 默认展开，true 默认折叠

# ----- 文章页信息显示 -----
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
  post:
    date_type: both # 显示创建与更新时间
    date_format: date
    categories: true
    tags: true

# ----- 文章目录 -----
toc:
  post: true
  page: false
  number: true
  expand: true
  style_simple: false
  scroll_percent: true

# ----- 相关文章推荐 -----
related_post:
  enable: true
  limit: 6
  date_type: created

# ----- 文章版权声明（作者与链接自动取自 _config.yml 的 author 和 url）-----
post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/1987066289
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 打赏二维码（暂时关闭，想开启就改 enable: true 并放图片到 source/img/）
reward:
  enable: false

# ----- 文章底部分享按钮 -----
share:
  use: sharejs
  sharejs:
    sites: wechat,qq,qzone,weibo

# ----- 图片懒加载 + 点击放大 -----
lazyload:
  enable: true
  field: site
  placeholder:
  blur: false

lightbox: fancybox

# ----- 页脚 -----
footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: false
  custom_text: 由 Hexo 强力驱动 | 托管于 EdgeOne Pages

# ----- 右下角按钮 -----
rightside_scroll_percent: true # 回到顶部按钮显示阅读百分比

# ----- 评论系统（默认关闭，以后想加再开，如 Waline/Twikoo/Giscus）-----
comments:
  use:

# ----- 自定义注入：横幅跳转 + 精装修样式 + 心理增强（源码在 tools/，改完运行 node tools/build-inject.js 重新生成）-----
